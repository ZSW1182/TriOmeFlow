  <script>
function langmuirOccupancy(concentration, kd) {
  const c = Math.max(0, Number(concentration) || 0);
  const k = Math.max(Number.EPSILON, Number(kd) || 0);
  return c / (k + c);
}

function normalizeWeights(weights, changedKey) {
  const keys = ['affinity','breadth','stability','secretion'];
  const next = Object.fromEntries(keys.map(k => [k, Math.max(0, Number(weights[k]) || 0)]));
  const fixed = Math.max(0, Math.min(100, next[changedKey] ?? 0));
  next[changedKey] = fixed;
  const others = keys.filter(k => k !== changedKey);
  const remaining = 100 - fixed;
  const currentOther = others.reduce((s,k)=>s+next[k],0);
  if (currentOther <= 0) {
    const each = remaining / others.length;
    others.forEach(k => next[k] = each);
  } else {
    others.forEach(k => next[k] = remaining * (next[k] / currentOther));
  }
  // remove floating drift deterministically from the final non-changed key
  const sum = keys.reduce((s,k)=>s+next[k],0);
  const target = others[others.length - 1] ?? changedKey;
  next[target] += 100 - sum;
  return next;
}

function rankCandidates(candidates, weights) {
  const denom = Math.max(1, Object.values(weights).reduce((a,b)=>a+Number(b || 0),0));
  return candidates.map(c => {
    const score = (
      c.affinity * (weights.affinity || 0) +
      c.breadth * (weights.breadth || 0) +
      c.stability * (weights.stability || 0) +
      c.secretion * (weights.secretion || 0)
    ) / denom;
    return {...c, score};
  }).sort((a,b)=> b.score - a.score || a.id.localeCompare(b.id));
}

function paretoFront(candidates) {
  const metrics = ['affinity','breadth','stability','secretion'];
  return candidates.filter((c, i) => !candidates.some((other,j) => {
    if (i === j) return false;
    const noWorse = metrics.every(m => other[m] >= c[m]);
    const strictlyBetter = metrics.some(m => other[m] > c[m]);
    return noWorse && strictlyBetter;
  }));
}

function interventionParams(base) {
  const c = Math.max(0, Math.min(1, Number(base.coverage) || 0));
  let beta = base.beta;
  let k = base.k;
  let gamma = base.gamma;
  if (base.intervention === 'medi8852' || base.intervention === 'combined') {
    beta *= (1 - 0.58 * c); // deterministic demo assumption
    k *= (1 - 0.46 * c);    // deterministic demo assumption
  }
  if (base.intervention === '1g01' || base.intervention === 'combined') {
    gamma *= (1 + 0.72 * c); // deterministic demo assumption
  }
  return {beta, k, gamma, omega: base.omega, p: base.p};
}

function derivatives(state, params, N) {
  const {S,E,I,A,R} = state;
  const {beta,k,gamma,omega,p} = params;
  const force = beta * S * (I + k*A) / N;
  return {
    S: -force,
    E: force - omega*E,
    I: (1-p)*omega*E - gamma*I,
    A: p*omega*E - gamma*A,
    R: gamma*(I+A),
  };
}

function addState(a, b, scale=1) {
  return {
    S: a.S + b.S*scale,
    E: a.E + b.E*scale,
    I: a.I + b.I*scale,
    A: a.A + b.A*scale,
    R: a.R + b.R*scale,
  };
}

function rk4Step(state, dt, params, N) {
  const k1 = derivatives(state, params, N);
  const k2 = derivatives(addState(state,k1,dt/2), params, N);
  const k3 = derivatives(addState(state,k2,dt/2), params, N);
  const k4 = derivatives(addState(state,k3,dt), params, N);
  const next = {};
  for (const key of ['S','E','I','A','R']) {
    next[key] = state[key] + dt*(k1[key] + 2*k2[key] + 2*k3[key] + k4[key])/6;
    if (next[key] < 0 && next[key] > -1e-8) next[key] = 0;
  }
  // correct floating drift into S to keep N conserved
  const total = next.S+next.E+next.I+next.A+next.R;
  next.S += N-total;
  return next;
}

function reproductionIndicator({beta,k,gamma,p}) {
  return beta * ((1-p) + k*p) / gamma;
}

function simulateSEIAR(config) {
  const cfg = structuredClone(config);
  const dt = cfg.dt || 0.25;
  const N = cfg.N;
  const params = interventionParams(cfg);
  let state = {...cfg.initial};
  const trajectory = [{day:0, ...state}];
  const steps = Math.round(cfg.days/dt);
  for (let step=1; step<=steps; step++) {
    state = rk4Step(state, dt, params, N);
    const day = step*dt;
    if (Math.abs(day - Math.round(day)) < dt/2 || step === steps) {
      trajectory.push({day:Number(day.toFixed(4)), ...state});
    }
  }
  let peak = trajectory[0];
  for (const row of trajectory) if (row.I > peak.I) peak = row;
  const last = trajectory[trajectory.length-1];
  const cumulative = N - last.S;
  const scenarioR = reproductionIndicator({...params});
  return {
    trajectory,
    effectiveParameters: params,
    metrics: {
      peakI: peak.I,
      peakDay: peak.day,
      cumulative,
      scenarioR,
    }
  };
}

function coverageSweep(preset, coverages = Array.from({length:21},(_,i)=>i/20)) {
  return coverages.map(coverage => {
    const result = simulateSEIAR({...preset, coverage});
    return {coverage, ...result.metrics};
  });
}

function calibrationResponse(temp, {midpoint=50,slope=0.32,constraintTemp=30,influence=0}) {
  const w = Math.max(0, Math.min(1, influence));
  const effectiveMid = midpoint*(1-w) + constraintTemp*w;
  return 1/(1+Math.exp(-slope*(temp-effectiveMid)));
}

function parseCsvText(text) {
  const lines = String(text).trim().split(/\r?\n/).filter(Boolean);
  if (!lines.length) return [];
  const parseLine = line => {
    const out=[]; let cur=''; let quoted=false;
    for (let i=0;i<line.length;i++) {
      const ch=line[i];
      if (ch==='"') {
        if (quoted && line[i+1]==='"') {cur+='"'; i++;}
        else quoted=!quoted;
      } else if (ch===',' && !quoted) { out.push(cur); cur=''; }
      else cur+=ch;
    }
    out.push(cur); return out;
  };
  const headers = parseLine(lines[0]).map(x=>x.trim());
  return lines.slice(1).map(line => {
    const vals=parseLine(line);
    const obj={}; headers.forEach((h,i)=>obj[h]=(vals[i]??'').trim()); return obj;
  });
}

function validateLongFormatCsv(rows) {
  const errors=[]; const required=['sample_id','feature_id','value'];
  if (!rows.length) return {valid:false, errors:['Dataset is empty']};
  const keys = Object.keys(rows[0]);
  for (const col of required) if (!keys.includes(col)) errors.push(`Missing required column: ${col}`);
  if (keys.includes('value')) rows.forEach((r,i)=>{ if (r.value==='' || !Number.isFinite(Number(r.value))) errors.push(`Row ${i+2}: non-numeric value`); });
  const missingIds = rows.filter(r=>!r.sample_id || !r.feature_id).length;
  if (missingIds) errors.push(`${missingIds} rows contain missing sample_id or feature_id`);
  return {valid:errors.length===0, errors};
}

function tr(text){
  if(state?.lang!=='cn') return String(text??'');
  let s=String(text??''); const lead=s.match(/^\s*/)?.[0]||'', tail=s.match(/\s*$/)?.[0]||'', core=s.trim();
  if(I18N[core]) return lead+I18N[core]+tail;
  let out=core;
  out=out.replace(/DBTL CYCLE #(\d+)/g,'DBTL 周期 #$1')
         .replace(/Create Cycle #(\d+)/g,'创建周期 #$1')
         .replace(/Cycle #(\d+)/g,'周期 #$1')
         .replace(/CYCLE #(\d+)/g,'周期 #$1')
         .replace(/Shortlist \((\d+)\)/g,'候选列表 ($1)')
         .replace(/^Peak ([\d,]+) · day (\d+)$/g,'峰值 $1 · 第 $2 天');
  out=out.replace(/Day (\d+(?:\.\d+)?)/g,'第 $1 天')
         .replace(/(\d+) rows · USER DATA/g,'$1 行 · 用户数据')
         .replace(/(\d+) samples · (\d+) features/g,'$1 个样本 · $2 个特征')
         .replace(/(\d+) samples · (\d+) taxa/g,'$1 个样本 · $2 个分类单元')
         .replace(/(\d+) source-derived · (\d+) simulation\/demo/g,'$1 条来源证据 · $2 条仿真/演示')
         .replace(/(\d+) items/g,'$1 项')
         .replace(/(\d+) evidence/g,'$1 条证据')
         .replace(/(\d+) observations/g,'$1 条观察')
         .replace(/(\d+) decisions/g,'$1 项决策')
         .replace(/Missing required column: ([^·]+)/g,'缺少必填列：$1')
         .replace(/Row (\d+): non-numeric value/g,'第 $1 行：value 不是数值')
         .replace(/(\d+) rows contain missing sample_id or feature_id/g,'$1 行缺少 sample_id 或 feature_id')
         .replace(/Module added: /g,'已添加模块：')
         .replace(/Explore (MEDI8852-[A-Z0-9]+)/g,'探索 $1');
  for(const [a,b] of I18N_PARTIAL) out=out.split(a).join(b);
  return lead+out+tail;
}
function applyI18n(root=document.getElementById('app')){
  document.documentElement.lang=state.lang==='cn'?'zh-CN':'en';
  document.title=state.lang==='cn'?'TriOmeFlow · FluBlockers 生信计算工作空间':'TriOmeFlow · FluBlockers Computational Workspace';
  if(state.lang!=='cn'||!root)return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){const p=n.parentElement;if(!n.nodeValue.trim()||!p||p.closest('pre,code,script,style,[data-i18n-lock]'))return NodeFilter.FILTER_REJECT;return NodeFilter.FILTER_ACCEPT;}});
  const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);nodes.forEach(n=>{n.nodeValue=tr(n.nodeValue)});
  root.querySelectorAll('input[placeholder],textarea[placeholder]').forEach(el=>{el.placeholder=tr(el.placeholder.replace(/^⌕\s*/,''));if(el.id==='workspaceSearch')el.placeholder='⌕  '+el.placeholder});
  root.querySelectorAll('[aria-label]').forEach(el=>el.setAttribute('aria-label',tr(el.getAttribute('aria-label'))));
  root.querySelectorAll('[title]').forEach(el=>{const v=el.getAttribute('title');if(v&&!v.includes(' · affinity '))el.setAttribute('title',tr(v))});
}

function renderWorkspaceSearchFeedback(){
  const f=state.searchFeedback;
  if(!f||!f.query) return '';
  const cls=f.kind==='none'?'error':f.kind==='methods'?'success':'info';
  const text=state.lang==='cn'
    ? (f.kind==='none'?`未找到匹配结果：${esc(f.query)}`:f.kind==='methods'?`找到 ${f.count} 个方法匹配`:`已定位：${tr(f.label||f.query)}`)

  return `<div id="workspaceSearchResult" class="workspace-search-result ${cls}" role="status">${text}</div>`;
}
function performWorkspaceSearch(raw){
  const q=String(raw||'').trim();
  if(!q){state.searchFeedback=null;persist();renderApp();return;}
  const ql=q.toLowerCase();
  const routeHit=ROUTES.find(([r,label])=>label.toLowerCase().includes(ql)||tr(label).toLowerCase().includes(ql)||r.includes(ql));
  if(routeHit){state.route=routeHit[0];state.inspector=null;state.searchFeedback={kind:'route',query:q,label:routeHit[1],count:1};persist();renderApp();return;}
  const methodHits=methodSearchMatches(q);
  if(methodHits.length){state.route='methods';state.methodsTab='methods';state.registrySearch=q;state.searchFeedback={kind:'methods',query:q,count:methodHits.length};persist();renderApp();return;}
  state.searchFeedback={kind:'none',query:q,count:0};persist();renderApp();
}

function candidateCards(){const ranked=rankCandidates([REFERENCE_CANDIDATE,...CANDIDATES],state.weights);const ref=ranked.find(c=>c.reference);const top=[ref,...ranked.filter(c=>!c.reference).slice(0,5)];const paretoIds=new Set(paretoFront([REFERENCE_CANDIDATE,...CANDIDATES]).map(x=>x.id));return top.map((c,i)=>`<div class="candidate-card ${state.selectedCandidate===c.id?'selected':''}" data-candidate="${c.id}"><div class="candidate-top"><div><div class="rank">${String(i+1).padStart(2,'0')} ${c.reference?'· REFERENCE':''}</div><div class="candidate-id">${c.id}</div></div><div class="score mono">${(c.score*100).toFixed(1)}</div></div><div class="metric-mini"><span>Aff<b>${c.affinity.toFixed(2)}</b></span><span>Brd<b>${c.breadth.toFixed(2)}</b></span><span>Stb<b>${c.stability.toFixed(2)}</b></span><span>Sec<b>${c.secretion.toFixed(2)}</b></span></div><div style="margin-top:7px;display:flex;align-items:center;justify-content:space-between;gap:6px"><span>${c.reference?badge('FLUBLOCKERS','source'):badge('DEMO','demo')} ${paretoIds.has(c.id)?badge('PARETO',''):''}</span>${c.reference?'':`<button class="btn small ${state.shortlist.includes(c.id)?'':'primary'}" data-shortlist="${c.id}">${state.shortlist.includes(c.id)?'Remove':'Shortlist'}</button>`}</div></div>`).join('')}
function objectiveControls(){return `<div><div class="eyebrow">DESIGN SETUP</div><div class="meta-grid"><dt>Target</dt><dd>Influenza HA</dd><dt>Subtype</dt><dd>H1N1</dd><dt>Structure template</dt><dd class="mono">PDB 1RUZ</dd><dt>Antibody template</dt><dd>MEDI8852 scFv</dd></div><div class="divider"></div><div class="eyebrow">DESIGN OBJECTIVES</div>${Object.entries(state.weights).map(([k,v])=>`<div class="objective"><div class="objective-head"><strong>${({affinity:'Binding Affinity',breadth:'Broad-spectrum Potential',stability:'Structural Stability',secretion:'Secretion Feasibility'})[k]}</strong><span class="mono">${v.toFixed(0)}%</span></div><input class="objective-slider" data-weight="${k}" type="range" min="0" max="70" step="1" value="${v}"></div>`).join('')}<div class="tiny muted">Weights are normalized to 100% · ranking is live.</div><div style="margin-top:12px">${btn('Re-rank Candidates','rerank','primary')}</div></div>`}
function paretoPlot(){const all=[REFERENCE_CANDIDATE,...CANDIDATES],front=new Set(paretoFront(all).map(x=>x.id));return `<div class="pareto"><div class="pareto-axis x"></div><div class="pareto-axis y"></div><span class="pareto-label axis-x-label">Affinity →</span><span class="pareto-label axis-y-label">Stability →</span>${all.map(c=>{const x=45+(c.affinity-.75)/.22*520;const y=250-(c.stability-.80)/.18*210;return `<span class="pareto-point ${front.has(c.id)?'frontier':''}" data-candidate="${c.id}" style="left:${x}px;top:${y}px" title="${c.id} · affinity ${c.affinity} · stability ${c.stability}"></span>`}).join('')}</div><div class="tiny muted">Purple = Pareto-optimal · metrics are deterministic synthetic design inputs except MEDI8852-WT reference context.</div>`}
function comparisonTable(){const selected=[REFERENCE_CANDIDATE,...CANDIDATES].filter(c=>c.reference||state.shortlist.includes(c.id)).slice(0,3);return `<table class="sci-table"><thead><tr><th>Metric</th>${selected.map(c=>`<th>${c.id}</th>`).join('')}</tr></thead><tbody>${['affinity','breadth','stability','secretion'].map(m=>`<tr><td>${m[0].toUpperCase()+m.slice(1)}</td>${selected.map(c=>`<td class="mono">${c[m].toFixed(2)}</td>`).join('')}</tr>`).join('')}</tbody></table><div class="tiny muted" style="margin-top:10px">Comparison includes reference + shortlisted demo candidates.</div>`}

function circuitPlot(){const W=760,H=300,pad={l:45,r:25,t:20,b:35};const xs=t=>pad.l+(t-25)/(55-25)*(W-pad.l-pad.r);const ys=v=>H-pad.b-v*(H-pad.t-pad.b);const temps=Array.from({length:61},(_,i)=>25+i*.5);const orig=temps.map(t=>[xs(t),ys(calibrationResponse(t,{midpoint:50,slope:.34,constraintTemp:30,influence:0}))]);const cal=temps.map(t=>[xs(t),ys(calibrationResponse(t,{midpoint:50,slope:.34,constraintTemp:30,influence:state.calibrationInfluence}))]);const path=pts=>'M'+pts.map(p=>p.map(x=>x.toFixed(1)).join(',')).join(' L');return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}">${[0,.25,.5,.75,1].map(v=>`<line class="chart-grid" x1="${pad.l}" x2="${W-pad.r}" y1="${ys(v)}" y2="${ys(v)}"/><text class="chart-label" x="${pad.l-9}" y="${ys(v)+3}" text-anchor="end">${v.toFixed(2)}</text>`).join('')}<rect x="${xs(28)}" y="${pad.t}" width="${xs(32)-xs(28)}" height="${H-pad.t-pad.b}" fill="#B66D91" opacity=".08"/><line x1="${xs(50)}" x2="${xs(50)}" y1="${pad.t}" y2="${H-pad.b}" stroke="#4E7898" stroke-dasharray="4 4"/><path d="${path(orig)}" class="chart-line" stroke="#4E7898" stroke-dasharray="5 4"/><path d="${path(cal)}" class="chart-line" stroke="#2F8C83"/><circle cx="${xs(30)}" cy="${ys(.48)}" r="5" fill="#B66D91" class="chart-marker"/><text class="chart-label" x="${xs(30)+7}" y="${ys(.48)-7}">Experimental expression change ~30°C</text><text class="chart-label" x="${xs(50)-4}" y="${pad.t+11}" text-anchor="end">Predicted structural transition ~50°C</text>${[25,30,37,42,50,55].map(t=>`<text class="chart-label" x="${xs(t)}" y="${H-11}" text-anchor="middle">${t}°</text>`).join('')}</svg>`}
function renderCircuitContent(){

const EPIDEMIC_PRESET={days:180,dt:.25,N:1_000_000,initial:{S:999800,E:100,I:70,A:30,R:0},beta:.743,k:.55,gamma:.14,omega:1/2.2,p:.35};
function currentEpi(){return simulateSEIAR({...EPIDEMIC_PRESET,intervention:state.intervention,coverage:state.coverage})}
function linePath(data,key,W,H,pad,maxY){const x=d=>pad.l+d.day/EPIDEMIC_PRESET.days*(W-pad.l-pad.r);const y=v=>H-pad.b-v/maxY*(H-pad.t-pad.b);return 'M'+data.map(d=>`${x(d).toFixed(1)},${y(d[key]).toFixed(1)}`).join(' L')}

async function sha256(text){
  if(globalThis.crypto?.subtle){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('')}
  const K=[
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ];
  const rotr=(x,n)=>(x>>>n)|(x<<(32-n));
  const input=Array.from(new TextEncoder().encode(String(text))); const bitLen=input.length*8;
  input.push(0x80); while((input.length%64)!==56) input.push(0);
  const hi=Math.floor(bitLen/0x100000000), lo=bitLen>>>0;
  for(let i=3;i>=0;i--) input.push((hi>>>(i*8))&255); for(let i=3;i>=0;i--) input.push((lo>>>(i*8))&255);
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  for(let off=0;off<input.length;off+=64){const w=new Uint32Array(64);for(let i=0;i<16;i++){const j=off+i*4;w[i]=((input[j]<<24)|(input[j+1]<<16)|(input[j+2]<<8)|input[j+3])>>>0}for(let i=16;i<64;i++){const s0=(rotr(w[i-15],7)^rotr(w[i-15],18)^(w[i-15]>>>3))>>>0;const s1=(rotr(w[i-2],17)^rotr(w[i-2],19)^(w[i-2]>>>10))>>>0;w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0}let [a,b,c,d,e,f,g,h]=H;for(let i=0;i<64;i++){const S1=(rotr(e,6)^rotr(e,11)^rotr(e,25))>>>0;const ch=((e&f)^((~e)&g))>>>0;const t1=(h+S1+ch+K[i]+w[i])>>>0;const S0=(rotr(a,2)^rotr(a,13)^rotr(a,22))>>>0;const maj=((a&b)^(a&c)^(b&c))>>>0;const t2=(S0+maj)>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0}H=[(H[0]+a)>>>0,(H[1]+b)>>>0,(H[2]+c)>>>0,(H[3]+d)>>>0,(H[4]+e)>>>0,(H[5]+f)>>>0,(H[6]+g)>>>0,(H[7]+h)>>>0]}
  return H.map(x=>x.toString(16).padStart(8,'0')).join('');
}

const VIEW3D={raf:new Set(),states:{}};

function rotate3D(p,cam){let{x,y,z}=p;const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw);[x,z]=[x*cy-z*sy,x*sy+z*cy];const cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);[y,z]=[y*cp-z*sp,y*sp+z*cp];return{x,y,z}}

function drawSoftGrid(ctx,W,H,dark=false){ctx.save();ctx.strokeStyle=dark?'rgba(126,169,190,.07)':'rgba(75,117,132,.08)';ctx.lineWidth=1;for(let x=0;x<W;x+=34){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=34){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.restore()}

function epidemicSurfaceData(){const coverages=Array.from({length:21},(_,i)=>i/20),days=Array.from({length:25},(_,i)=>i*7.5);return coverages.map(c=>{const sim=simulateSEIAR({...EPIDEMIC_PRESET,intervention:state.intervention,coverage:c});return days.map(d=>{let row=sim.trajectory.reduce((best,r)=>Math.abs(r.day-d)<Math.abs(best.day-d)?r:best,sim.trajectory[0]);return{coverage:c,day:d,burden:row.I+row.A}})})}
function drawEpidemicSurface(canvas,cam){const{ctx,W,H}=setupCanvas(canvas);ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#FBFDFD');bg.addColorStop(1,'#EDF4F5');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);drawSoftGrid(ctx,W,H,false);const data=epidemicSurfaceData(),max=Math.max(...data.flat().map(p=>p.burden),1);const map=p=>({x:(p.day/180-.5)*2.25,y:(p.burden/max)*1.65-.7,z:(p.coverage-.5)*1.75});for(let r=0;r<data.length-1;r++)for(let c=0;c<data[r].length-1;c++){const cell=[map(data[r][c]),map(data[r+1][c]),map(data[r+1][c+1]),map(data[r][c+1])].map(p=>project3D(p,cam,W,H));const avg=(data[r][c].burden+data[r+1][c].burden+data[r+1][c+1].burden+data[r][c+1].burden)/(4*max);ctx.beginPath();ctx.moveTo(cell[0].x,cell[0].y);cell.slice(1).forEach(q=>ctx.lineTo(q.x,q.y));ctx.closePath();ctx.fillStyle=`rgba(${Math.round(79+avg*106)},${Math.round(154-avg*62)},${Math.round(171-avg*83)},${.12+avg*.28})`;ctx.fill();ctx.strokeStyle='rgba(70,112,127,.18)';ctx.lineWidth=.7;ctx.stroke()}data.forEach(row=>line3D(ctx,row.map(map),cam,W,H,'#7596A2',.8,.45));for(let c=0;c<data[0].length;c++)line3D(ctx,data.map(row=>map(row[c])),cam,W,H,'#86A6B1',.75,.42);ctx.fillStyle='#6D808B';ctx.font='9px Inter,system-ui';ctx.fillText(state.lang==='cn'?'时间 →':'Time →',W-55,H-12);ctx.fillText(state.lang==='cn'?'覆盖率':'Coverage',12,17)}

function buildEpidemicGLScene(){/* EPIDEMIC_CONTOUR_PROJECTION */const raw=epidemicSurfaceData(),max=Math.max(...raw.flat().map(p=>p.burden),1),map=p=>[(p.day/180-.5)*2.5,(p.burden/max)*1.72-.86,(p.coverage-.5)*1.82],points=[],lines=[...sgAxes(1.72),...sgSurfaceAxisTicks()],triangles=[];
  for(let r=0;r<raw.length-1;r++)for(let c=0;c<raw[r].length-1;c++){const p00=raw[r][c],p10=raw[r+1][c],p11=raw[r+1][c+1],p01=raw[r][c+1],vs=[p00,p10,p11,p00,p11,p01];triangles.push({points:vs.map(map),colors:vs.map(v=>sgBurdenColor(v.burden/max,.58))})}
  raw.forEach((row,ri)=>lines.push(sgLine(row.map(map),ri===Math.round(state.coverage*20)?'#277F90':'#7896A1',ri===Math.round(state.coverage*20)?.92:.18)));for(let c=0;c<raw[0].length;c++)lines.push(sgLine(raw.map(row=>map(row[c])),'#7896A1',.18));
  const yBase=-.86;for(const frac of [.2,.4,.6,.8]){const threshold=max*frac,contour=[];for(let c=0;c<raw[0].length;c++){let z=null;for(let r=0;r<raw.length-1;r++){const a=raw[r][c],b=raw[r+1][c],da=a.burden-threshold,db=b.burden-threshold;if(da===0||da*db<=0){const q=Math.abs(a.burden-b.burden)<1e-9?0:(threshold-a.burden)/(b.burden-a.burden),cov=a.coverage+(b.coverage-a.coverage)*sgClamp(q,0,1);z=(cov-.5)*1.82;break}}if(z!==null)contour.push([(raw[0][c].day/180-.5)*2.5,yBase,z])}if(contour.length>2)lines.push(sgLine(contour,frac<.5?'#4B9E9B':'#B27762',.42))}
  const current=raw[Math.round(state.coverage*20)]||raw[0];if(CURRENT_COVERAGE_SLICE){for(let i=0;i<current.length-1;i++){const a=map(current[i]),b=map(current[i+1]),ab=[a[0],yBase,a[2]],bb=[b[0],yBase,b[2]],col=sgHex('#58B9C7',.07);triangles.push({points:[a,b,bb],colors:[col,col,col]},{points:[a,bb,ab],colors:[col,col,col]})}lines.push(sgLine(current.map(map),'#287F91',.98))}
  raw.forEach((row,ri)=>row.forEach((p,i)=>{if(i%4===0&&ri%2===0)points.push(sgPoint(map(p),sgBurdenColor(p.burden/max,1),5,`<b>${state.lang==='cn'?'SEIAR 曲面采样':'SEIAR surface sample'}</b><div>${state.lang==='cn'?'覆盖率':'Coverage'} ${(p.coverage*100).toFixed(0)}% · Day ${p.day}</div><div class="meta">${state.lang==='cn'?'感染负荷':'infectious burden'} ${Math.round(p.burden).toLocaleString()}</div>`,{alpha:.40,pickable:true}))}));
  const peak=current.reduce((a,b)=>a.burden>b.burden?a:b);points.push(sgPoint(map(peak),'#F2C47F',22,`<b>${state.lang==='cn'?'当前覆盖率峰值':'Current coverage peak'}</b><div>${Math.round(state.coverage*100)}% · Day ${peak.day}</div><div class="meta">I + A = ${Math.round(peak.burden).toLocaleString()}</div>`,{alpha:1,pickable:true}));points.push(sgPoint(map(peak),'#E39B57',38,'',{alpha:.11,pickable:false}));return{points,lines,triangles}}
function initEpidemicGL(){const c=document.getElementById('epidemicSurfaceCanvas');if(!c)return;sgCreateHud(c,['WEBGL','SEIAR · RK4',state.lang==='cn'?'实时曲面':'LIVE SURFACE']);const engine=new ScientificGL(c,{camera:{yaw:-.82,pitch:.56,distance:5.65,auto:true},background:[.958,.974,.979,1],fog:[.958,.974,.979,1],fogNear:6.0,fogFar:11.8});if(!engine.gl)return;engine.setScene(buildEpidemicGLScene());const auto=document.getElementById('epi3dAuto');auto?.classList.add('active');auto?.addEventListener('click',()=>{engine.setAuto(!engine.camera.auto);auto.classList.toggle('active',engine.camera.auto);auto.textContent=tr(engine.camera.auto?'Pause':'Auto Rotate')});document.getElementById('epi3dReset')?.addEventListener('click',()=>engine.reset({yaw:-.82,pitch:.56,distance:5.65,auto:false,target:[0,0,0]}))}

function stop3DAnimations(){try{for(const id of VIEW3D.raf)cancelAnimationFrame(id);VIEW3D.raf.clear()}catch{}for(const engine of [...SCIGL.instances])engine.destroy()}
function initScientific3D(){if(state.route==='tri-omics'&&state.omicsTab==='manifold')initOmicsGL();if(state.route==='antibody')initMoleculeGL();if(state.route==='circuit'&&state.circuitTab==='structure')initRnaGL();if(state.route==='epidemic'&&state.epidemicTab==='surface')initEpidemicGL()}


function downloadBlob(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},100)}
function downloadJson(name,obj){downloadBlob(name,JSON.stringify(obj,null,2),'application/json')}
function downloadCsv(name,rows){if(!rows.length)return;const keys=Object.keys(rows[0]);const q=v=>`"${String(v??'').replaceAll('"','""')}"`;downloadBlob(name,[keys.join(','),...rows.map(r=>keys.map(k=>q(r[k])).join(','))].join('\n'),'text/csv')}
function exportSummary(){downloadJson('triomeflow-workspace-summary.json',{project:'FluBlockers',facts:FLUBLOCKERS_FACTS,cycle:state.cycle,shortlist:state.shortlist,runs:state.runs})}
function exportCandidates(){downloadCsv('antibody-ranking.csv',rankCandidates([REFERENCE_CANDIDATE,...CANDIDATES],state.weights).map((c,i)=>({rank:i+1,candidate:c.id,score:(c.score*100).toFixed(2),affinity:c.affinity,breadth:c.breadth,stability:c.stability,secretion:c.secretion,deltaG:c.deltaG,source:c.provenance||'FLUBLOCKERS SOURCE'})))}
function exportTrajectory(){const r=currentEpi();downloadCsv('seiar-trajectory.csv',r.trajectory.map(x=>({day:x.day,S:x.S,E:x.E,I:x.I,A:x.A,R:x.R})))}
function exportCycle(){downloadJson(`dbtl-cycle-${state.cycle}.json`,{cycle:state.cycle,shortlist:state.shortlist,circuitUpdate:state.circuitUpdate,epidemicScenario:state.epidemicScenario,queue:state.dbtlQueue.length?state.dbtlQueue:generateQueue(),runs:state.runs})}
function exportMethods(){const md=['# TriOmeFlow Methods','',...METHODS.map(m=>`## ${m.name}\n- Scale: ${m.scale}\n- Origin: ${m.origin}\n- Execution: ${m.execution}\n- Purpose: ${m.purpose}\n- Source: ${m.source}\n`)];downloadBlob('triomeflow-methods.md',md.join('\n'),'text/markdown')}
function exportManifest(){downloadJson('triomeflow-manifest.json',{application:{name:'TriOmeFlow',version:'1.0.0',runtime:'Browser',networkDependency:'None'},sources:SOURCES,methods:METHODS,datasets:{demoVersion:'1.2.0',userOmics:state.omicsUserData},assumptions:ASSUMPTIONS,runs:state.runs,workspace:{cycle:state.cycle,shortlist:state.shortlist,circuitUpdate:state.circuitUpdate,savedScenario:state.epidemicScenario},scientificDisclosure:'Synthetic demonstration outputs are not experimentally validated biological findings.'})}
function toast(msg,type=''){const root=document.getElementById('toast-root');const el=document.createElement('div');el.className=`toast ${type}`;el.textContent=tr(msg);root.appendChild(el);setTimeout(()=>el.remove(),2600)}
function showModal(title,html){const wrap=document.createElement('div');wrap.className='modal-backdrop';wrap.innerHTML=`<div class="modal"><div class="modal-head"><b>${tr(title)}</b><button class="btn ghost small modalClose">${tr('Close')}</button></div><div class="modal-body">${html}</div><div class="modal-foot"><button class="btn primary modalClose">${tr('OK')}</button></div></div>`;if(state.lang==='cn')applyI18n(wrap);document.body.appendChild(wrap);wrap.querySelectorAll('.modalClose').forEach(b=>b.onclick=()=>wrap.remove())}

const TOUR_STEPS=[
  {route:'overview',selector:'[data-tour="overview-map"]',title:'MULTISCALE OVERVIEW',text:'FluBlockers connects molecular interaction, engineered probiotic behavior, regulatory feedback and epidemic dynamics within one computational workspace.'},
  {route:'tri-omics',selector:'[data-tour="omics-network"]',title:'CROSS-DOMAIN SIGNALS',text:'Explore a clearly labeled synthetic Host–Probiotic–Virus network while preserving provenance and cross-view interpretation.'},
  {route:'workflow',selector:'.workflow-canvas',title:'REPRODUCIBLE WORKFLOW',text:'Compose and inspect a local bioinformatics DAG with live Nextflow code generation and deterministic execution simulation.'},
  {route:'antibody',selector:'[data-tour="antibody-view"]',title:'MULTI-OBJECTIVE ANTIBODY DESIGN',text:'Inspect MEDI8852–HA source context and re-rank synthetic candidates using live multi-objective scoring and Pareto analysis.'},
  {route:'epidemic',selector:'[data-tour="epidemic-chart"]',title:'POPULATION IMPACT',text:'Translate source-reported intervention directions into an offline live SEIAR scenario simulation with explicit demo assumptions.'},
  {route:'dbtl',selector:'[data-tour="dbtl-decision"]',title:'CLOSE THE LOOP',text:'Aggregate evidence, conflicts and simulation context into deterministic next-cycle research actions.'}
];
function startTour(){const keepLang=state.lang;state={...structuredClone(DEFAULT_STATE),lang:keepLang,route:TOUR_STEPS[0].route,tour:{index:0}};persist();renderApp()}
function renderTour(){const step=TOUR_STEPS[state.tour.index];return `<div class="tour-dimmer"></div><div class="tour-panel"><div class="count">${String(state.tour.index+1).padStart(2,'0')} / ${String(TOUR_STEPS.length).padStart(2,'0')}</div><h3>${step.title}</h3><p>${step.text}</p><div class="tour-actions"><button class="btn small" id="tourExit">Exit</button><div><button class="btn ghost small" id="tourBack" ${state.tour.index===0?'disabled':''}>Back</button><button class="btn primary small" id="tourNext">${state.tour.index===TOUR_STEPS.length-1?'Complete':'Next'}</button></div></div></div>`}
function applyTourHighlight(){document.querySelectorAll('.tour-highlight').forEach(x=>x.classList.remove('tour-highlight'));const step=TOUR_STEPS[state.tour.index];document.querySelector(step.selector)?.classList.add('tour-highlight');document.getElementById('tourExit')?.addEventListener('click',()=>{state.tour=null;persist();renderApp()});document.getElementById('tourBack')?.addEventListener('click',()=>{if(state.tour.index>0){state.tour.index--;state.route=TOUR_STEPS[state.tour.index].route;persist();renderApp()}});document.getElementById('tourNext')?.addEventListener('click',()=>{if(state.tour.index===TOUR_STEPS.length-1){state.tour=null;persist();renderApp();toast('Guided Demo complete · explore freely','success')}else{state.tour.index++;state.route=TOUR_STEPS[state.tour.index].route;persist();renderApp()}})}

window.addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(ROUTES.some(x=>x[0]===r)){state.route=r;persist();renderApp()}});
window.addEventListener('keydown',e=>{
  if(e.target && ['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
  if((e.key==='g'||e.key==='G') && !state.tour){e.preventDefault();startTour();return;}
  if(!state.tour) return;
  if(e.key==='Escape'){e.preventDefault();state.tour=null;persist();renderApp();return;}
  if(e.key==='ArrowLeft' && state.tour.index>0){e.preventDefault();state.tour.index--;state.route=TOUR_STEPS[state.tour.index].route;persist();renderApp();return;}
  if(e.key==='ArrowRight'){
    e.preventDefault();
    if(state.tour.index===TOUR_STEPS.length-1){state.tour=null;persist();renderApp();toast('Guided Demo complete · explore freely','success');}
    else{state.tour.index++;state.route=TOUR_STEPS[state.tour.index].route;persist();renderApp();}
  }
});

const requestedLang=new URLSearchParams(location.search).get('lang');if(requestedLang==='cn'||requestedLang==='en')state.lang=requestedLang;const initial=location.hash.slice(1);if(ROUTES.some(x=>x[0]===initial))state.route=initial;
renderApp();

  </script>
